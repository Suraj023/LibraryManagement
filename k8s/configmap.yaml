apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: default
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "library_db"
  DB_USERNAME: "root"
  JWT_EXPIRY_MINUTES: "60"
  # Kafka is not deployed yet (comes in Phase 3 with Helm).
  # AUTO_STARTUP=false lets the app boot without a live Kafka broker.
  # Remove both lines below once Kafka is running and update KAFKA_BOOTSTRAP_SERVERS.
  KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
  SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
