apiVersion: v1
kind: Service
metadata:
  name: library-app
  namespace: default
spec:
  # NodePort makes the app reachable outside the cluster via minikube ip + nodePort.
  # Change to ClusterIP when you add an Ingress (Phase 3).
  type: NodePort
  selector:
    app: library-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080