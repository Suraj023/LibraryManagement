spring.application.name=Library


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

#***********************************************************************************



#spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update


#spring.jpa.database-platform=org.hibernate.dialect.SQLServer2008Dialect

spring.level.org.hibernate.SQL=debug
server.port=8080

b2b.app.jwtSecret=${JWT_SECRET:U3ByaW5nQm9vdExpYnJhcnlNYW5hZ2VtZW50SldUU2VjcmV0S2V5MTIzNDU2Nzg5MA==}
b2b.app.jwtExpiryMinutes=${JWT_EXPIRY_MINUTES:60}

# API Gateway - rate limits (requests per minute per IP)
gateway.routes.users.rateLimit=30
gateway.routes.books.rateLimit=60

#**********************************************************************************
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-log-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
